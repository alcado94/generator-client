[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "empresa-sdk"
version = "1.0.0"
description = "Instalación selectiva de SDK de Empresa"
requires-python = ">=3.11"
dependencies = ["empresa-sdk-core==1.0.0"]

[project.optional-dependencies]
ventas = ["empresa-sdk-ventas==1.0.0"]
clientes = ["empresa-sdk-clientes==1.0.0"]
productos = ["empresa-sdk-productos==1.0.0"]
sistema = ["empresa-sdk-sistema==1.0.0"]
all = ["empresa-sdk-ventas==1.0.0", "empresa-sdk-clientes==1.0.0", "empresa-sdk-productos==1.0.0", "empresa-sdk-sistema==1.0.0"]

[tool.setuptools]
packages = []
